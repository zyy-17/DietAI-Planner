server:
  port: 8080

spring:
  application:
    name: DietAI-Planner
  datasource:
    url: jdbc:mysql://localhost:3306/diet_ai_planner?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

jwt:
  secret: DietAI-Planner-Secret-Key-2026-ZYYQQ-Very-Long-Secret-For-HS256-Algorithm-Security
  expiration: 86400000

ai-service:
  url: http://localhost:8000

logging:
  level:
    com.zyyqq: debug
    org.hibernate.SQL: debug